- name: Update apt cache
  apt:
    update_cache: yes

- name: Install base packages
  apt:
    name:
      - curl
      - vim
      - htop
      - git
      - python3-pip
    state: present

- name: Install passlib for Python 3
  pip:
    name: passlib
    executable: pip3

- name: Set timezone to UTC
  timezone:
    name: Etc/UTC


